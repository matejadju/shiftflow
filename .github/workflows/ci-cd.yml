name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Ob novem pushu na isto vejo/PR prekliči še tekoči zagon.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Frontend: URL backenda se ob gradnji vgradi iz okoljske spremenljivke
      # (repozitorijska spremenljivka VITE_API_URL; prazna = relativne poti /api).
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

      # Backend: Prisma Client ni v gitu, zato ga generiramo pred prevajanjem.
      # DATABASE_URL je tu le navidezna vrednost (generate se ne poveže z bazo).
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      # Paket za deploy: prevedena koda + datoteke za namestitev odvisnosti in migracije.
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: |
            backend/dist
            backend/prisma
            backend/prisma.config.ts
            backend/package.json
            backend/package-lock.json
          if-no-files-found: error
          retention-days: 7
